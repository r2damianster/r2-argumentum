name: Verificar

# Corre las pruebas y el build en cada push y pull request. No bloquea a Vercel (que despliega
# por su cuenta), pero deja un check rojo/verde visible en GitHub para cada commit.
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verificar
